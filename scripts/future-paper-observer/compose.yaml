services:
  paper-observer:
    build:
      context: ../..
      dockerfile: scripts/future-paper-observer/Dockerfile
    image: polyhermes-paper-observer:altcoin-20261112
    container_name: future-paper-observer
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 160m
    cpus: 0.5
    tmpfs: [/tmp:size=8m]
    volumes:
      - /opt/polyhermes/paper-observer/state:/state
    networks: [polyhermes]
networks:
  polyhermes:
    external: true
    name: polyhermes_polyhermes-network
