services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        BUILD_IN_DOCKER: "false"
        VERSION: readonly-public
        GIT_TAG: readonly-public
    container_name: polyhermes-readonly
    ports:
      - "127.0.0.1:8088:80"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8000
      COPY_TRADING_POLLING_ENABLED: "false"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - polyhermes-readonly

  mysql:
    image: mysql:8.2
    container_name: polyhermes-readonly-mysql
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: polyhermes
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - polyhermes-readonly-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - polyhermes-readonly

volumes:
  polyhermes-readonly-mysql-data:

networks:
  polyhermes-readonly:
    driver: bridge
